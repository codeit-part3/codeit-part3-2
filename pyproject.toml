[project]
name = "project"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.2.4",
]

[dependency-groups]
preprocess = [
    "pymupdf>=2.1",
    "olefile>=0.47",
    "pyarrow>=26.0.1",
    "tqdm>=4.70.1",
]

backend = [
    "fastapi>=0.162.0",
    "loguru>=0.7.3",
]

engines = [
    "langchain>=1.4.9",
    "langchain-chroma>=1.1.0",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.8.1",
    "langchain-text-splitters>=1.1.3",
    "pandas>=3.1.1",
    "numpy>=2.5.4",
    "torch>=2.14.1",
    "sentence-transformers>=6.3.0",
    "python-docx>=1.1.2",
]

frontend = [
    "gradio>=6.31.0",
    "httpx>=0.28.1"
]


[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
