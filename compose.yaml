services:
  # gradio frontend
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gguk-frontend
    ports:
      - "7860:7860"
    env_file:
      - .env
    environment:
      - BACKEND_URL=http://136.111.105.21:8000
    depends_on:
      backend:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: gguk-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - HF_HOME=/root/.cache/huggingface
      - OLLAMA_BASE_URL=http://ollama:11434
    volumes:
      - indexes:/root/app/indexes
      - guide_cache:/root/app/outputs/guides/_cache
      - hf_cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.reqeust.ullopen('http://localhost:8000/docs')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    depends_on:
      ollama-pull:
        condition: service_completed_successfully
      hf-pull:
        condition: service_completed_successfully

  # Download re-rank model
  hf-pull:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: gguk-hf-pull
    environment:
      - HF_HOME=/root/.cache/huggingface
    volumes:
      - hf_cache:/root/.cache/huggingface
    command: uv run --no-sync python -c "from huggingface_hub import snapshot_download;
            snapshot_download('BAAI/bge-reranker-v2-m3')"

  # Ollama 로컬 모델 서빙 서비스
  ollama:
    image: ollama/ollama:0.40.16
    container_name: gguk-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Ollama 모델 및 임베딩 벡터 다운로드
  ollama-pull:
    image: ollama/ollama:0.40.16
    container_name: gguk-ollama-pull
    environment:
      - OLLAMA_HOST=http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy

    entrypoint: >
      sh -c "
      ollama pull gemma4:e2b &&
      ollama pull embeddinggemma
      "


volumes:
  ollama_data:
  hf_cache:
  # mounted data
  indexes:
  guide_cache:
